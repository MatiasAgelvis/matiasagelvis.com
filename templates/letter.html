<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Letter builder</title>
  <style>
    :root {
      --ink: #111;
      --muted: #57606a;
      --line: #d0d7de;
      --accent: #0969da;
      --bg: #eef1f4;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }

    body {
      display: grid;
      grid-template-columns: 21rem 1fr;
      min-height: 100vh;
      background: var(--bg);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
    }

    /* ---------- form panel ---------- */
    .panel {
      position: sticky;
      top: 0;
      max-height: 100vh;
      overflow-y: auto;
      padding: 1.25rem 1.25rem 3rem;
      background: #fff;
      border-right: 1px solid var(--line);
    }
    .panel h1 {
      font-size: 0.95rem;
      margin: 0 0 0.25rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
    }
    .panel .hint { font-size: 0.78rem; color: var(--muted); margin: 0 0 1rem; line-height: 1.4; }
    .panel .hint kbd {
      font: inherit;
      background: #f6f8fa;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 0 0.25rem;
    }
    label {
      display: block;
      font-size: 0.74rem;
      color: var(--muted);
      margin: 0.7rem 0 0.2rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    input, textarea, select {
      width: 100%;
      font: inherit;
      font-size: 0.85rem;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0.4rem 0.5rem;
    }
    input:focus, textarea:focus, select:focus {
      outline: 2px solid var(--accent);
      outline-offset: -1px;
      border-color: var(--accent);
    }
    textarea { resize: vertical; min-height: 5rem; line-height: 1.45; }
    .actions { display: flex; gap: 0.5rem; margin-top: 1.25rem; }
    button {
      font: inherit;
      font-size: 0.85rem;
      cursor: pointer;
      border-radius: 6px;
      padding: 0.5rem 0.9rem;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
    button:hover { border-color: var(--accent); }

    /* ---------- A4 preview ---------- */
    .preview { padding: 2rem 1.5rem 4rem; display: flex; justify-content: center; align-items: flex-start; }

    .sheet {
      width: 210mm;
      min-height: 297mm;
      padding: 22mm 24mm;
      background: #fff;
      box-shadow: 0 2px 24px rgb(0 0 0 / 0.14);
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 10.5pt;
      line-height: 1.5;
      color: var(--ink);
    }
    .head { display: flex; justify-content: space-between; gap: 16mm; margin-bottom: 14mm; }
    .sender { font-size: 9pt; line-height: 1.45; color: var(--muted); }
    .sender strong { display: block; font-size: 13pt; color: var(--ink); margin-bottom: 0.5mm; }
    .sender a { color: inherit; text-decoration: none; }
    .recipient { text-align: right; font-size: 9.5pt; line-height: 1.45; }
    .pre { white-space: pre-line; }
    .meta { text-align: right; margin: 0 0 9mm; }
    .subject { font-weight: 600; margin: 0 0 6mm; }
    .sheet p { margin: 0 0 4mm; }
    .salutation { margin-bottom: 5mm !important; }
    .signature { margin-top: 16mm !important; }
    .empty { color: #b0b6bd; }

    @media (max-width: 900px) {
      body { grid-template-columns: 1fr; }
      .panel { position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--line); }
      .preview { padding: 1rem; overflow-x: auto; justify-content: flex-start; }
    }

    /* ---------- print: only the sheet ---------- */
    @media print {
      @page { size: A4; margin: 22mm 24mm; }
      body { display: block; background: #fff; }
      .panel { display: none !important; }
      .preview { display: block; padding: 0; }
      .sheet {
        width: auto;
        min-height: 0;
        padding: 0;
        box-shadow: none;
        margin: 0;
      }
      .empty { color: inherit; }
    }
  </style>
</head>
<body>
  <aside class="panel no-print">
    <h1>Letter builder</h1>
    <p class="hint">
      Local only — nothing is uploaded. Print with <kbd>Ctrl</kbd>/<kbd>Cmd</kbd>+<kbd>P</kbd>
      and choose "Save as PDF", scale 100%.
    </p>

    <label for="lang">Language</label>
    <select id="lang" data-input="lang">
      <option value="fr">Français</option>
      <option value="en">English</option>
    </select>

    <label for="recipientName">Recipient name</label>
    <input id="recipientName" data-input="recipientName" autocomplete="off" />

    <label for="recipientTitle">Recipient title</label>
    <input id="recipientTitle" data-input="recipientTitle" autocomplete="off" />

    <label for="company">Company</label>
    <input id="company" data-input="company" autocomplete="off" />

    <label for="companyAddress">Company address</label>
    <textarea id="companyAddress" data-input="companyAddress" rows="3"></textarea>

    <label for="position">Position</label>
    <input id="position" data-input="position" autocomplete="off" />

    <label for="place">Place</label>
    <input id="place" data-input="place" autocomplete="off" />

    <label for="date">Date</label>
    <input id="date" type="date" data-input="date" />

    <label for="salutation">Salutation</label>
    <input id="salutation" data-input="salutation" autocomplete="off" />

    <label for="opening">Opening</label>
    <textarea id="opening" data-input="opening" rows="2"></textarea>

    <label for="body">Why this company</label>
    <textarea id="body" data-input="body" rows="4"></textarea>

    <label for="evidence">Evidence</label>
    <textarea id="evidence" data-input="evidence" rows="5"></textarea>

    <label for="closing">Closing</label>
    <textarea id="closing" data-input="closing" rows="2"></textarea>

    <label for="closingFormula">Closing formula</label>
    <textarea id="closingFormula" data-input="closingFormula" rows="2"></textarea>

    <div class="actions">
      <button class="primary" type="button" onclick="window.print()">Print / save PDF</button>
      <button type="button" id="reset">Reset</button>
    </div>
  </aside>

  <main class="preview">
    <article class="sheet">
      <div class="head">
        <div class="sender">
          <strong>$name$</strong>
          <span id="senderTitle">Ingénieur logiciel</span><br />
          <a href="mailto:$email$">$email$</a><br />
          <a href="tel:$phone-href$">$phone$</a><br />
          <a href="https://$website$">$website$</a><br />
          <a href="$linkedin$">linkedin.com/in/matias-agelvis</a>
        </div>
        <div class="recipient">
          <span data-field="recipientName"></span><br />
          <span data-field="recipientTitle"></span><br />
          <span data-field="company"></span><br />
          <span class="pre" data-field="companyAddress"></span>
        </div>
      </div>

      <p class="meta"><span id="placeLine"></span></p>
      <p class="subject"><span id="subjectLabel">Objet :</span> <span data-field="position"></span></p>

      <p class="salutation" data-field="salutation"></p>
      <p data-field="opening"></p>
      <p data-field="body"></p>
      <p data-field="evidence"></p>
      <p data-field="closing"></p>
      <p class="closing" data-field="closingFormula"></p>
      <p class="signature">$name$</p>
    </article>
  </main>

  <script>
    const STORAGE_KEY = "letter-builder-v1";

    const DEFAULTS = {
      fr: {
        subjectLabel: "Objet :",
        senderTitle: "Ingénieur logiciel",
        salutation: "Madame, Monsieur,",
        opening: "Je me permets de vous adresser ma candidature et vous remercie de l'attention que vous porterez à mon dossier.",
        body: "Ce qui retient particulièrement mon attention chez vous, c'est ...",
        evidence: "Au cours de mon dernier contrat chez SNAPP', j'ai conçu la couche d'authentification et d'autorisation d'une plateforme bancaire (sessions JWT, RBAC, 2FA multi-canal) et reconstruit de bout en bout une intégration FIX 4.2 sur WebSocket, en production. J'y ai également conçu les APIs REST asynchrones FastAPI et les services communiquant via RabbitMQ, sur trois bases MySQL.",
        closing: "Je serais heureux d'échanger avec vous sur vos besoins et de vous présenter mon travail plus en détail.",
        closingFormula: "Je vous prie d'agréer, Madame, Monsieur, l'expression de mes salutations distinguées.",
      },
      en: {
        subjectLabel: "Subject:",
        senderTitle: "Software Engineer",
        salutation: "Dear Sir or Madam,",
        opening: "I am writing to apply for the position and thank you for considering my application.",
        body: "What particularly draws me to your company is ...",
        evidence: "In my most recent contract at SNAPP', I designed the authentication and authorization layer of a banking platform (JWT sessions, RBAC, multi-channel 2FA) and rebuilt a FIX 4.2 integration over WebSocket end to end, in production. I also designed the asynchronous FastAPI REST APIs and services communicating over RabbitMQ, across three MySQL databases.",
        closing: "I would welcome the opportunity to discuss your needs and to present my work in more detail.",
        closingFormula: "Yours faithfully,",
      },
    };

    const langSelect = document.getElementById("lang");
    const subjectLabel = document.getElementById("subjectLabel");
    const placeLine = document.getElementById("placeLine");
    const inputs = [...document.querySelectorAll("[data-input]")];
    const outputs = [...document.querySelectorAll("[data-field]")];
    const byName = (name) => document.querySelector('[data-input="' + name + '"]');

    function todayISO() {
      const now = new Date();
      const offset = now.getTimezoneOffset() * 60000;
      return new Date(now - offset).toISOString().slice(0, 10);
    }

    function formatPlaceLine(lang, place, iso) {
      if (!iso) return "";
      const date = new Date(iso + "T00:00:00");
      if (Number.isNaN(date.getTime())) return place || "";
      const formatted = date.toLocaleDateString(lang === "fr" ? "fr-FR" : "en-GB", {
        day: "numeric",
        month: "long",
        year: "numeric",
      });
      if (!place) return formatted;
      return lang === "fr" ? place + ", le " + formatted : place + ", " + formatted;
    }

    function render() {
      const lang = langSelect.value;
      subjectLabel.textContent = DEFAULTS[lang].subjectLabel;
      document.getElementById("senderTitle").textContent = DEFAULTS[lang].senderTitle;

      for (const output of outputs) {
        const input = byName(output.dataset.field);
        const value = input ? input.value : "";
        output.textContent = value;
        output.classList.toggle("empty", !value.trim());
      }

      placeLine.textContent = formatPlaceLine(
        lang,
        byName("place").value,
        byName("date").value,
      );
    }

    function applyLanguageDefaults(nextLang, previousLang) {
      const next = DEFAULTS[nextLang];
      const previous = DEFAULTS[previousLang];
      for (const key of ["salutation", "opening", "body", "evidence", "closing", "closingFormula"]) {
        const input = byName(key);
        const current = input.value.trim();
        if (!current || current === previous[key].trim()) input.value = next[key];
      }
    }

    function save() {
      const data = { lang: langSelect.value };
      for (const input of inputs) data[input.dataset.input] = input.value;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function seedDefaults() {
      const lang = langSelect.value;
      for (const [key, value] of Object.entries(DEFAULTS[lang])) {
        const input = byName(key);
        if (input) input.value = value;
      }
    }

    function restore() {
      let saved = null;
      try {
        saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
      } catch (_) {
        saved = null;
      }

      if (!saved) {
        langSelect.value = "fr";
        byName("place").value = "Bordeaux";
        byName("date").value = todayISO();
        seedDefaults();
        return;
      }

      langSelect.value = saved.lang || "fr";
      for (const input of inputs) {
        if (input.dataset.input in saved) input.value = saved[input.dataset.input];
      }
      if (!byName("date").value) byName("date").value = todayISO();
    }

    let previousLang = langSelect.value;

    langSelect.addEventListener("change", () => {
      applyLanguageDefaults(langSelect.value, previousLang);
      previousLang = langSelect.value;
      render();
      save();
    });

    for (const input of inputs) {
      input.addEventListener("input", () => {
        render();
        save();
      });
    }

    document.getElementById("reset").addEventListener("click", () => {
      localStorage.removeItem(STORAGE_KEY);
      location.reload();
    });

    restore();
    render();
  </script>
</body>
</html>
